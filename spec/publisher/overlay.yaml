# Publication operations, overlaid onto the consumption specification.
#
# Everything shared with the consumption API is referenced, never redefined.
# build.mjs fails the build if this file declares a path method, schema,
# parameter, response or request body that the consumption specification
# already owns — which is how the previous copy drifted.

paths:
  # ── Product ───────────────────────────────────────────────────────────────
  /product:
    post:
      summary: Create a TEA Product
      description: |
        Create a product and return the object the consumption API will serve,
        including the UUID and identifiers the server assigned.
      operationId: createTeaProduct
      parameters:
        - $ref: "#/components/parameters/idempotency-key"
      requestBody:
        $ref: "#/components/requestBodies/write-product"
      responses:
        "201":
          $ref: "#/components/responses/product-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "409":
          $ref: "#/components/responses/publisher-conflict"
      tags:
        - TEA Publication
  /product/{uuid}:
    patch:
      summary: Update a TEA Product
      description: Update a product's mutable fields. Omitted fields are left unchanged.
      operationId: updateTeaProduct
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      requestBody:
        $ref: "#/components/requestBodies/write-product"
      responses:
        "200":
          $ref: "#/components/responses/product-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
        "409":
          $ref: "#/components/responses/publisher-conflict"
      tags:
        - TEA Publication
    delete:
      summary: Delete a TEA Product
      description: |
        Delete a product and everything beneath it.

        Deletion does not retract what consumers already hold. A product that
        has been public SHOULD also be withdrawn through a CLE `withdrawn`
        event, so a consumer who acted on it learns that it was retracted
        rather than simply finding it gone.
      operationId: deleteTeaProduct
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      responses:
        "204":
          $ref: "#/components/responses/object-deleted"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication

  # ── Component ─────────────────────────────────────────────────────────────
  /component:
    post:
      summary: Create a TEA Component
      operationId: createTeaComponent
      description: Create a component and return the object the consumption API will serve.
      parameters:
        - $ref: "#/components/parameters/idempotency-key"
      requestBody:
        $ref: "#/components/requestBodies/write-component"
      responses:
        "201":
          $ref: "#/components/responses/component-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "409":
          $ref: "#/components/responses/publisher-conflict"
      tags:
        - TEA Publication
  /component/{uuid}:
    patch:
      summary: Update a TEA Component
      description: Update a component's mutable fields. Omitted fields are left unchanged.
      operationId: updateTeaComponent
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      requestBody:
        $ref: "#/components/requestBodies/write-component"
      responses:
        "200":
          $ref: "#/components/responses/component-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
        "409":
          $ref: "#/components/responses/publisher-conflict"
      tags:
        - TEA Publication
    delete:
      summary: Delete a TEA Component
      description: Delete a component and its releases.
      operationId: deleteTeaComponent
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      responses:
        "204":
          $ref: "#/components/responses/object-deleted"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication

  # ── Releases ──────────────────────────────────────────────────────────────
  # Split to match the consumption API, which has distinguished product
  # releases from component releases since 0.1.0. A single /release could not
  # say which of the two it was creating.
  /productRelease:
    post:
      summary: Create a TEA Product Release
      operationId: createTeaProductRelease
      description: Create a release of a product.
      parameters:
        - $ref: "#/components/parameters/idempotency-key"
      requestBody:
        $ref: "#/components/requestBodies/write-product-release"
      responses:
        "201":
          $ref: "#/components/responses/product-release-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "409":
          $ref: "#/components/responses/publisher-conflict"
      tags:
        - TEA Publication
  /productRelease/{uuid}:
    patch:
      summary: Update a TEA Product Release
      operationId: updateTeaProductRelease
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      description: Update a product release's mutable fields.
      requestBody:
        $ref: "#/components/requestBodies/write-product-release"
      responses:
        "200":
          $ref: "#/components/responses/product-release-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication
    delete:
      summary: Delete a TEA Product Release
      operationId: deleteTeaProductRelease
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      description: Delete a product release and the collection it holds.
      responses:
        "204":
          $ref: "#/components/responses/object-deleted"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication
  /componentRelease:
    post:
      summary: Create a TEA Component Release
      operationId: createTeaComponentRelease
      description: Create a release of a component.
      parameters:
        - $ref: "#/components/parameters/idempotency-key"
      requestBody:
        $ref: "#/components/requestBodies/write-component-release"
      responses:
        "201":
          $ref: "#/components/responses/component-release-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "409":
          $ref: "#/components/responses/publisher-conflict"
      tags:
        - TEA Publication
  /componentRelease/{uuid}:
    patch:
      summary: Update a TEA Component Release
      operationId: updateTeaComponentRelease
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      description: Update a component release's mutable fields.
      requestBody:
        $ref: "#/components/requestBodies/write-component-release"
      responses:
        "200":
          $ref: "#/components/responses/component-release-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication
    delete:
      summary: Delete a TEA Component Release
      operationId: deleteTeaComponentRelease
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      description: Delete a component release and the collection it holds.
      responses:
        "204":
          $ref: "#/components/responses/object-deleted"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication

  # ── Collections ───────────────────────────────────────────────────────────
  # A collection is not an independent object: the consumption specification
  # states its UUID matches the release it belongs to, and that an update only
  # changes the version. Publishing one is therefore addressed through its
  # release, and is a PUT rather than a POST — there is one current collection
  # per release, and this replaces it with the next version.
  /productRelease/{uuid}/collection:
    put:
      summary: Publish a new collection version for a product release
      operationId: publishTeaProductReleaseCollection
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      description: |
        Publish the next version of this release's collection.

        The server assigns the version, incrementing from the current one.
        `updateReason` is required: a collection whose contents change without
        saying why is indistinguishable, to a consumer, from one that was
        tampered with.
      requestBody:
        $ref: "#/components/requestBodies/write-collection"
      responses:
        "200":
          $ref: "#/components/responses/collection-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication
  /componentRelease/{uuid}/collection:
    put:
      summary: Publish a new collection version for a component release
      operationId: publishTeaComponentReleaseCollection
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      description: |
        Publish the next version of this release's collection. The server
        assigns the version, and `updateReason` is required.
      requestBody:
        $ref: "#/components/requestBodies/write-collection"
      responses:
        "200":
          $ref: "#/components/responses/collection-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication

  # ── Distributions ─────────────────────────────────────────────────────────
  #
  # A collection says what evidence exists about a release. A distribution says
  # how the release is obtained. Publishing the first without the second leaves
  # a consumer that resolved a TEI holding an SBOM and no download link.
  #
  # Attached to a component release because that is where the consumption
  # schema defines them: `release.distributions` exists, `productRelease` has no
  # such field. A publisher wanting download links therefore decomposes its
  # product into at least one component — the model the consumption
  # specification already assumes, not an extra requirement of this overlay.
  /componentRelease/{uuid}/distribution:
    post:
      summary: Declare a distribution of a component release
      operationId: createTeaDistribution
      description: |
        Declare one delivered form of this release: a file to download, or a
        channel a user installs from.

        Idempotent on the `url`, or on the `description` where a channel has no
        single file to fetch — `brew install`, `scoop install`, `nix run`. A
        pipeline that retries therefore updates the link rather than leaving a
        consumer to choose between two identical ones.

        At least one of `url` and `description` is required. A distribution
        with neither is a UUID: it gives a consumer nothing to follow and
        nothing to recognise.

        Checksums are recorded verbatim. This server does not hold the bytes a
        distribution points at, so it cannot verify them and does not claim to
        have — which is why a publisher should copy the digests from the same
        manifest its users verify against rather than recomputing them.
      parameters:
        - $ref: "#/components/parameters/object-uuid"
        - $ref: "#/components/parameters/idempotency-key"
      requestBody:
        $ref: "#/components/requestBodies/write-distribution"
      responses:
        "201":
          $ref: "#/components/responses/distribution-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
        "409":
          $ref: "#/components/responses/publisher-conflict"
      tags:
        - TEA Publication
  /distribution/{uuid}:
    delete:
      summary: Withdraw a distribution
      operationId: deleteTeaDistribution
      description: |
        Stop advertising this download.

        It does not unpublish whatever the URL pointed at, and it does not
        reach anyone who already resolved it. Withdrawing a link is a statement
        about what this catalogue advertises from now on, not a recall.
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      responses:
        "204":
          $ref: "#/components/responses/object-deleted"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication

  # ── Artifacts ─────────────────────────────────────────────────────────────
  /artifact:
    post:
      summary: Create a TEA Artifact
      operationId: createTeaArtifact
      description: |
        Register an artifact within a release's collection.

        This creates the entry and its formats; it does not carry the bytes.
        Content goes up per format afterwards. Keeping the two apart matters
        because an SBOM is routinely tens of megabytes, and a publisher who
        must resend all of it to correct one metadata field will in practice
        not correct the field.
      parameters:
        - $ref: "#/components/parameters/idempotency-key"
      requestBody:
        $ref: "#/components/requestBodies/write-artifact"
      responses:
        "201":
          $ref: "#/components/responses/artifact-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
        "409":
          $ref: "#/components/responses/publisher-conflict"
      tags:
        - TEA Publication
  /artifact/{uuid}:
    patch:
      summary: Update a TEA Artifact
      operationId: updateTeaArtifact
      description: |
        Update an artifact's metadata.

        Stored bytes are immutable: a checksum a consumer has already recorded
        must not begin describing different content. Replacing content means a
        new format or a new artifact version, never an overwrite in place.
      parameters:
        - $ref: "#/components/parameters/artifact-uuid"
      requestBody:
        $ref: "#/components/requestBodies/update-artifact"
      responses:
        "200":
          $ref: "#/components/responses/artifact-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication
    delete:
      summary: Delete a TEA Artifact
      operationId: deleteTeaArtifact
      description: Delete an artifact and any content this server holds for it.
      parameters:
        - $ref: "#/components/parameters/artifact-uuid"
      responses:
        "204":
          $ref: "#/components/responses/object-deleted"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication
  /artifact/{uuid}/format/{formatIndex}/content:
    put:
      summary: Upload artifact content
      operationId: uploadTeaArtifactContent
      description: |
        Upload the bytes of one artifact format.

        The body is the artifact itself in its own media type, rather than
        base64 inside JSON, which would inflate it by a third for no benefit.

        A client SHOULD send `Content-Digest` (RFC 9530). Where it does, the
        server MUST verify it against the received bytes and reject a mismatch.
        That is what makes an upload safe to retry: a truncated transfer fails
        loudly instead of publishing corrupt content under a checksum that says
        otherwise.
      parameters:
        - $ref: "#/components/parameters/artifact-uuid"
        - $ref: "#/components/parameters/format-index"
        - $ref: "#/components/parameters/content-digest"
      requestBody:
        required: true
        description: The artifact bytes, in the media type declared by the format.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/vnd.cyclonedx+json:
            schema:
              type: string
              format: binary
          application/spdx+json:
            schema:
              type: string
              format: binary
          application/sarif+json:
            schema:
              type: string
              format: binary
      responses:
        "200":
          $ref: "#/components/responses/artifact-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
        "413":
          $ref: "#/components/responses/publisher-payload-too-large"
        "415":
          $ref: "#/components/responses/publisher-unsupported-media-type"
      tags:
        - TEA Publication
  /artifact/{uuid}/format/{formatIndex}/signature:
    put:
      summary: Attach a detached signature to an artifact format
      operationId: uploadTeaArtifactSignature
      description: |
        Attach a detached signature, declaring the scheme it was produced with.

        The consumption API exposes a `signatureUrl` and nothing more, so a
        consumer must infer the scheme from the bytes before it can verify
        anything. The publisher knows, and recording it is what turns a
        signature from something that exists into something that can be
        checked. See signatures/signature.md.
      parameters:
        - $ref: "#/components/parameters/artifact-uuid"
        - $ref: "#/components/parameters/format-index"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/artifact-signature"
      responses:
        "200":
          $ref: "#/components/responses/artifact-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
        "415":
          $ref: "#/components/responses/publisher-unsupported-media-type"
      tags:
        - TEA Publication

  # ── Publication targets ───────────────────────────────────────────────────
  #
  # Where `publishTo` sends a copy. Registration is separate from use because a
  # credential is involved and because handing an object to another server is a
  # decision that outlives the object: once a copy lands there, this server's
  # access policy no longer governs it.
  #
  # Mirroring is asynchronous and MUST NOT block or fail the local write. A
  # remote outage is the target's problem; refusing to record a publisher's own
  # release because a mirror is unreachable would make every target a single
  # point of failure for publication itself. The state is reported on the
  # object's access policy instead, where a publisher can find it.
  #
  # Mirroring is one hop. A server MUST NOT onward-mirror an object it received
  # as a copy, or two servers configured towards each other would exchange the
  # same object indefinitely.
  /publicationTargets:
    get:
      summary: List registered publication targets
      operationId: listTeaPublicationTargets
      description: The remote servers this organisation may mirror objects to.
      parameters:
        - $ref: "#/components/parameters/page-size"
        - $ref: "#/components/parameters/page-token"
        - $ref: "#/components/parameters/sort-order"
      responses:
        "200":
          $ref: "#/components/responses/paginated-publication-target"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "501":
          $ref: "#/components/responses/publisher-mirroring-unsupported"
      tags:
        - TEA Publication Target
    post:
      summary: Register a publication target
      operationId: createTeaPublicationTarget
      description: |
        Register a remote TEA server this organisation may mirror to.

        A server SHOULD verify the target before accepting it — that the root
        answers, advertises a compatible version, and accepts the credential —
        so that a target which was never going to work fails here, in front of
        whoever configured it, rather than later inside an asynchronous mirror
        nobody is watching.
      parameters:
        - $ref: "#/components/parameters/idempotency-key"
      requestBody:
        $ref: "#/components/requestBodies/write-publication-target"
      responses:
        "201":
          $ref: "#/components/responses/publication-target-written"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "409":
          $ref: "#/components/responses/publisher-conflict"
        "501":
          $ref: "#/components/responses/publisher-mirroring-unsupported"
      tags:
        - TEA Publication Target
  /publicationTargets/{uuid}:
    get:
      summary: Read a publication target
      operationId: getTeaPublicationTarget
      description: The target as registered. The credential is never returned.
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      responses:
        "200":
          $ref: "#/components/responses/publication-target-written"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication Target
    delete:
      summary: Deregister a publication target
      operationId: deleteTeaPublicationTarget
      description: |
        Stop mirroring to this target and discard its credential.

        It does not recall the copies already sent. The target holds them under
        its own policy, which is what mirroring means, so removing a target is
        a statement about future copies only.

        A server MUST also remove the target from any `publishTo` naming it,
        rather than leaving policies pointing at a target that no longer
        exists.
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      responses:
        "204":
          $ref: "#/components/responses/object-deleted"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication Target

  # ── Publisher read surface ────────────────────────────────────────────────
  #
  # A publisher cannot reconcile its own state through the consumption API,
  # because that API answers what a *reader* is entitled to see. The one thing
  # a publisher most needs to check — whether something private is in fact
  # private — is precisely what a consumption response cannot tell it, since an
  # object correctly withheld and an object that was never created look
  # identical from outside.
  #
  # So these two operations report the objects the caller published together
  # with the policy in force for each. They are scoped to the caller's own
  # organisation and to no other; there is no cross-publisher listing here,
  # deliberately.
  /publications:
    get:
      summary: List the products this organisation has published
      operationId: listTeaPublications
      description: |
        The caller's own products, each with the access policy actually in
        force and the number of releases beneath it.

        Paginated on the same terms as the consumption listings, because a
        catalogue large enough to be worth reconciling is large enough to need
        it.
      parameters:
        - $ref: "#/components/parameters/page-size"
        - $ref: "#/components/parameters/page-token"
        - $ref: "#/components/parameters/sort-field-product"
        - $ref: "#/components/parameters/sort-order"
      responses:
        "200":
          $ref: "#/components/responses/paginated-publication"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
      tags:
        - TEA Publication
  /publications/{uuid}/releases:
    get:
      summary: List the releases published under a product
      operationId: listTeaPublishedReleases
      description: |
        The releases of one of the caller's own products, each with the policy
        in force, the current collection version and how many artifacts it
        holds.

        The collection version is what makes this worth having separately from
        the consumption listing: a release whose collection is still at version
        0 has been created and never populated, which is invisible to a
        consumer and is exactly the state a publisher wants to find.
      parameters:
        - $ref: "#/components/parameters/object-uuid"
        - $ref: "#/components/parameters/page-size"
        - $ref: "#/components/parameters/page-token"
        - $ref: "#/components/parameters/sort-field-product-release"
        - $ref: "#/components/parameters/sort-order"
      responses:
        "200":
          $ref: "#/components/responses/paginated-published-release"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Publication

  # ── Access policy ─────────────────────────────────────────────────────────
  # Named "access policy" rather than "distribution" because the consumption
  # specification already uses `release-distribution` for something else
  # entirely: a downloadable build with its own URL and checksums. Reusing the
  # word for access control in a combined document would be actively
  # misleading.
  /accessPolicy/{uuid}:
    get:
      summary: Read the access policy in force for an object
      operationId: getTeaAccessPolicy
      description: |
        The access policy actually in force, after inheritance.

        Reported as both what the object declares and what it effectively has,
        because the difference between the two is exactly where accidental
        disclosure hides.
      parameters:
        - $ref: "#/components/parameters/object-uuid"
      responses:
        "200":
          $ref: "#/components/responses/access-policy-read"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
      tags:
        - TEA Access Policy
    put:
      summary: Set the access policy for an object
      operationId: setTeaAccessPolicy
      description: |
        Replace the object's own access policy.

        A server MUST reject a policy wider than the effective policy of the
        object's parent, with `ACCESS_WIDENS_PARENT`.

        A change to `public` MUST carry `confirm=public`, because no later
        request undoes it: whatever was fetched while it was public stays
        fetched. Naming the mechanism rather than only asking for "a
        confirmation" is deliberate — an unspecified requirement is one every
        publisher satisfies differently, which is the failure this document
        exists to avoid.
      parameters:
        - $ref: "#/components/parameters/object-uuid"
        - $ref: "#/components/parameters/confirm-public"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/access-policy"
      responses:
        "200":
          $ref: "#/components/responses/access-policy-read"
        "400":
          $ref: "#/components/responses/publisher-bad-request"
        "401":
          $ref: "#/components/responses/publisher-unauthorized"
        "403":
          $ref: "#/components/responses/publisher-forbidden"
        "404":
          $ref: "#/components/responses/publisher-not-found"
        "409":
          $ref: "#/components/responses/publisher-conflict"
      tags:
        - TEA Access Policy

components:
  schemas:
    publisher-error-type:
      type: string
      description: |
        Classification of a publication error.

        Extends the consumption specification's `unknown-error-type` with the
        failures only a writer can hit. The two consumption values are repeated
        so a client can branch on one enumeration rather than two.
      enum:
        - OBJECT_UNKNOWN
        - OBJECT_NOT_SHAREABLE
        - INVALID_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - DUPLICATE_OBJECT
        - VERSION_CONFLICT
        - ACCESS_WIDENS_PARENT
        - UNSUPPORTED_MEDIA_TYPE
        - PAYLOAD_TOO_LARGE
        - CHECKSUM_MISMATCH
        - SIGNATURE_INVALID
        - MIRRORING_UNSUPPORTED
        - UNKNOWN_PUBLICATION_TARGET

    publisher-error-response:
      type: object
      description: |
        A publication error. Same envelope as the consumption specification's
        `error-response`, over the wider publication enumeration, with an
        optional human-readable message and a pointer to the offending field.

        Publication is automated — a release pipeline is usually the caller —
        so a failure has to be actionable without a human reading prose.
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/publisher-error-type"
        message:
          type: string
          description: Human-readable explanation. Not a stable interface; branch on `error`.
        field:
          type: string
          description: JSON Pointer to the offending member of the request body, where one applies.
      required:
        - error

    access-policy:
      type: object
      description: |
        Who may read an object through the consumption API.

        TEA describes how transparency data is fetched, not who is entitled to
        fetch it. That is a reasonable boundary for a consumption API and an
        impossible one for a publication API, where the same server holds
        material that is deliberately public, material shared with named
        counterparties under agreement, and material that is purely internal.
        Absent this, every publisher invents an answer, incompatibly.

        Resolved by inheritance: an artifact takes its collection's policy, a
        collection its release's, a release its product's. An object MAY narrow
        what it inherits and MUST NOT widen it — a server rejects the attempt
        with `ACCESS_WIDENS_PARENT`. Without that rule, marking a product
        private would guarantee nothing, because any artifact beneath it could
        quietly be made public.

        A consumer denied by this policy is answered with the consumption
        specification's existing `OBJECT_NOT_SHAREABLE`, so enforcement needs
        no new consumer-side behaviour.
      additionalProperties: false
      properties:
        visibility:
          type: string
          description: |
            `private` — only the publishing organisation may read it.

            `shared` — readable by the publishing organisation and the
            organisations named in `sharedWith`. Authentication is required and
            the reader's identity decides the answer.

            `public` — readable without authentication. The only value that
            makes an object part of the open transparency web, and irreversible
            in practice: what has been fetched cannot be recalled.
          enum:
            - private
            - shared
            - public
          default: private
        sharedWith:
          type: array
          description: |
            Organisations entitled to read this object when `visibility` is
            `shared`. MUST be empty for any other visibility, so that a later
            change to `private` cannot silently leave a grant standing.
          items:
            $ref: "#/components/schemas/share-grant"
        publishTo:
          type: array
          description: |
            Registered publication targets this object is mirrored to, by
            UUID. Mirroring is a copy, not a reference: once an object reaches
            another server, this server's policy no longer governs it, which is
            why a target has to be registered deliberately rather than named
            inline by URL.

            A server that does not mirror MUST reject a non-empty list with
            `MIRRORING_UNSUPPORTED`. Accepting it and doing nothing is the one
            unacceptable response, because the publisher would then believe a
            copy exists somewhere it does not.

            Naming a target that is not registered is `UNKNOWN_PUBLICATION_TARGET`.
          items:
            $ref: "#/components/schemas/uuid"
      required:
        - visibility

    share-grant:
      type: object
      description: An entitlement for one organisation to read one object.
      additionalProperties: false
      properties:
        organizationUuid:
          description: The consuming organisation's identifier on this server.
          $ref: "#/components/schemas/uuid"
        organizationName:
          type: string
          description: Display name when the grant was made. Advisory; the UUID is the identity.
        grantedAt:
          $ref: "#/components/schemas/date-time"
        expiresAt:
          description: |
            When the grant lapses. A grant for the length of an evaluation or a
            contract is the common case, and a server that cannot express an
            expiry pushes publishers towards grants nobody ever revokes.
          $ref: "#/components/schemas/date-time"
      required:
        - organizationUuid

    publication-target:
      type: object
      description: |
        A remote TEA server this publisher mirrors objects to, as this server
        holds it.

        Registered as its own object rather than named inline in a policy for
        two reasons. A credential is involved, and a credential repeated in
        every policy is a credential in every audit log. And mirroring is a
        copy the receiving server then governs, so which servers a publisher is
        willing to hand objects to is a decision worth making once and
        reviewing, not one made in passing while setting a visibility.
      additionalProperties: false
      properties:
        uuid:
          description: Identifier of this target on this server.
          $ref: "#/components/schemas/uuid"
        rootUrl:
          type: string
          format: uri
          description: |
            The remote server's TEA root, without a trailing slash — the same
            value that server advertises as `rootUrl` in its own discovery
            document.
        domain:
          type: string
          description: |
            The TEI domain-name component of the target, which is what a
            consumer resolves. Derived from `rootUrl` and reported so a
            publisher can see where a copy went.
        description:
          type: string
          description: What this target is, for whoever reviews the list later.
        credential:
          type: string
          writeOnly: true
          description: |
            Bearer credential this server presents when publishing to the
            target. Write-only: a server MUST NOT return it, and MUST NOT
            report whether one is held in any form that distinguishes one
            credential from another.
        createdAt:
          $ref: "#/components/schemas/date-time"
      required:
        - uuid
        - rootUrl

    mirror-status:
      type: object
      description: |
        The state of mirroring one object to one target.

        Reported rather than set: a publisher states where an object should go
        and the server reports how far it got. A publisher that cannot see a
        failed mirror has to discover it from the counterparty.
      additionalProperties: false
      properties:
        target:
          description: The publication target this state refers to.
          $ref: "#/components/schemas/uuid"
        domain:
          type: string
          description: The target's TEI domain, repeated so a reader need not resolve the UUID.
        state:
          type: string
          description: |
            State of the most recent attempt.

            `pending` — accepted locally, not yet copied. `published` — the
            target acknowledged it. `failed` — the last attempt did not
            succeed and `detail` says why; the server SHOULD retry, and MUST
            NOT silently give up without leaving this state visible.
          enum:
            - pending
            - published
            - failed
        lastAttemptAt:
          $ref: "#/components/schemas/date-time"
        detail:
          type: string
          description: Why the last attempt failed, when it did.
      required:
        - target
        - state

    artifact-signature:
      type: object
      description: |
        A detached signature over an artifact format's bytes.

        signatures/signature.md calls for an indication of the hash algorithm,
        an indicator of the certificate used, and the intermediate and signing
        certificates. This carries them, plus the transparency-log entry where
        the scheme has one — a signature that is itself publicly logged is far
        harder to backdate.
      additionalProperties: false
      properties:
        signatureType:
          type: string
          description: The scheme, so a consumer knows how to verify rather than having to guess.
          enum:
            - jws
            - jsf
            - cose
            - pgp
            - x509-cms
            - sigstore-bundle
            - ssh
        url:
          type: string
          format: url
          description: Direct download URL for the detached signature.
        algorithm:
          type: string
          description: Hash algorithm the signature was computed over, e.g. SHA-256.
        keyId:
          type: string
          description: Key identifier the signature was produced with, where the scheme has one.
        certificateUrl:
          type: string
          format: url
          description: Signing certificate, where verification needs one.
        certificateChainUrl:
          type: string
          format: url
          description: Intermediate certificates between the signing certificate and a trusted root.
        transparencyLogUrl:
          type: string
          format: url
          description: Entry in a signature transparency log, such as Rekor.
        signedAt:
          $ref: "#/components/schemas/date-time"
      required:
        - signatureType
        - url

    access-policy-status:
      type: object
      description: An object's declared access policy alongside the one actually enforced.
      additionalProperties: false
      properties:
        uuid:
          description: The object the policy applies to.
          $ref: "#/components/schemas/uuid"
        declared:
          description: |
            What this object sets for itself. Absent when it declares nothing
            and relies entirely on inheritance.
          $ref: "#/components/schemas/access-policy"
        effective:
          description: What is enforced, after inheritance.
          $ref: "#/components/schemas/access-policy"
        inheritedFrom:
          description: |
            The ancestor the effective policy came from, when it was not
            declared here. Naming it lets a publisher fix the cause rather than
            the symptom.
          $ref: "#/components/schemas/uuid"
        mirrors:
          type: array
          description: |
            How far mirroring has got, per target. Absent where the object is
            mirrored nowhere, or where the server does not mirror at all.
          items:
            $ref: "#/components/schemas/mirror-status"
      required:
        - uuid
        - effective

    publication:
      type: object
      description: |
        One product this organisation has published, as the consumption API
        serves it, alongside the access policy in force for it.

        The product is carried whole rather than flattened so that a publisher
        can compare it byte for byte against what `GET /product/{uuid}`
        returns; a summary in a different shape would have to be trusted rather
        than checked.
      additionalProperties: false
      properties:
        product:
          $ref: "#/components/schemas/product"
        accessPolicy:
          description: Declared and effective policy, so the gap between them is visible here too.
          $ref: "#/components/schemas/access-policy-status"
        releaseCount:
          type: integer
          minimum: 0
          description: How many releases exist beneath this product.
      required:
        - product
        - accessPolicy

    published-release:
      type: object
      description: One release this organisation has published, with what a consumer would find in it.
      additionalProperties: false
      properties:
        release:
          $ref: "#/components/schemas/productRelease"
        accessPolicy:
          $ref: "#/components/schemas/access-policy-status"
        collectionVersion:
          type: integer
          minimum: 0
          description: |
            Version of this release's current collection, or 0 where no
            collection has been published yet — a release a consumer can
            resolve and find nothing in.
        artifactCount:
          type: integer
          minimum: 0
          description: How many artifacts the current collection holds.
      required:
        - release
        - accessPolicy

    paginated-publication-target-response:
      description: A paginated response containing registered publication targets
      allOf:
        - $ref: "#/components/schemas/pagination-details"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/publication-target"
          required:
            - results

    paginated-publication-response:
      description: A paginated response containing this organisation's published products
      allOf:
        - $ref: "#/components/schemas/pagination-details"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/publication"
          required:
            - results

    paginated-published-release-response:
      description: A paginated response containing this organisation's published releases
      allOf:
        - $ref: "#/components/schemas/pagination-details"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/published-release"
          required:
            - results

  parameters:
    object-uuid:
      name: uuid
      in: path
      required: true
      description: UUID of the object.
      schema:
        $ref: "#/components/schemas/uuid"
    artifact-uuid:
      name: uuid
      in: path
      required: true
      description: UUID of the TEA Artifact.
      schema:
        $ref: "#/components/schemas/uuid"
    format-index:
      name: formatIndex
      in: path
      required: true
      description: |
        Zero-based index of the format within the artifact's `formats` array.
        Formats are addressed positionally because a media type is not unique
        within an artifact — the same document is often published both
        compressed and not.
      schema:
        type: integer
        minimum: 0
    confirm-public:
      name: confirm
      in: query
      required: false
      description: |
        Acknowledges an irreversible change. Required, with the value `public`,
        on a request that sets `visibility` to `public`; ignored otherwise.

        A server MUST reject such a request without it, so that publishing to
        the open web is something a caller states outright rather than
        something a mistyped field does on its behalf.
      schema:
        type: string
        enum:
          - public
    idempotency-key:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-chosen key that makes a create safe to retry.

        Publication runs in release pipelines, and pipelines retry. Without
        this, a timeout that actually succeeded produces a second object on the
        next attempt — a duplicate discovered by a consumer rather than by the
        publisher. A server supporting the key MUST return the original result
        for a repeat of the same key rather than creating again.
      schema:
        type: string
        maxLength: 255
    content-digest:
      name: Content-Digest
      in: header
      required: false
      description: |
        Digest of the request body per RFC 9530, e.g. `sha-256=:<base64>:`.
        Where supplied, the server MUST verify it against the bytes received
        and reject a mismatch rather than storing content that does not match
        the checksum it will be published under.
      schema:
        type: string

  responses:
    object-deleted:
      description: |
        The object was deleted and is no longer resolvable through the
        consumption API.
    publisher-bad-request:
      description: The request body is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-unauthorized:
      description: Authentication is required, or the credential was rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-forbidden:
      description: |
        Authenticated, but not entitled to perform this operation on this
        object. Distinct from 401 on purpose: a publisher debugging a pipeline
        needs to know whether the credential was rejected or the permission
        was.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-not-found:
      description: No such object, or the caller may not see it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-conflict:
      description: |
        The request conflicts with the object's current state: a create that
        would duplicate an existing natural key, an update against a version
        since superseded, or an access policy wider than the object's parent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-mirroring-unsupported:
      description: |
        This server does not mirror to other TEA servers. Answered rather than
        quietly ignoring the request, so a publisher is never left believing a
        copy exists somewhere it does not.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-payload-too-large:
      description: The uploaded content exceeds the size this server accepts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-unsupported-media-type:
      description: The supplied media type is not one this server accepts for the object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    product-written:
      description: The product as the consumption API will serve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/product"
    component-written:
      description: The component as the consumption API will serve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/component"
    product-release-written:
      description: The product release as the consumption API will serve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/productRelease"
    component-release-written:
      description: The component release as the consumption API will serve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/release"
    collection-written:
      description: The newly published collection version.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/collection"
    artifact-written:
      description: The artifact as the consumption API will serve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/artifact"
    distribution-written:
      description: The distribution as the consumption API will serve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/release-distribution"
    access-policy-read:
      description: The access policy in force for the object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/access-policy-status"
    publication-target-written:
      description: The publication target as registered, without its credential.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publication-target"
    paginated-publication-target:
      description: A paginated response containing registered publication targets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-publication-target-response"
    paginated-publication:
      description: A paginated response containing this organisation's published products.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-publication-response"
    paginated-published-release:
      description: A paginated response containing this organisation's published releases.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-published-release-response"

  requestBodies:
    write-product:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: Product name.
              identifiers:
                type: array
                description: |
                  Identifiers for the product. A server assigns the TEI itself
                  — it names the server's own authority over the object, so a
                  publisher supplying one would be asserting something only the
                  server can know.
                items:
                  $ref: "#/components/schemas/identifier"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
    write-component:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: Component name.
              identifiers:
                type: array
                items:
                  $ref: "#/components/schemas/identifier"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
    write-product-release:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              product:
                description: UUID of the product this release belongs to.
                $ref: "#/components/schemas/uuid"
              version:
                type: string
                description: Version of the release.
              releaseDate:
                $ref: "#/components/schemas/date-time"
              preRelease:
                type: boolean
                description: Whether this release is a pre-release.
              identifiers:
                type: array
                items:
                  $ref: "#/components/schemas/identifier"
              components:
                type: array
                description: |
                  The components this release is composed of, optionally
                  pinning a specific component release.

                  Present because the consumption specification lists
                  `components` among `productRelease`'s required members: a
                  publisher with no way to state it can only ever produce
                  releases a server has to serve as an empty list, which is a
                  claim about the product rather than a gap in the record.

                  Omitted means unchanged on update, and empty on create.
                items:
                  $ref: "#/components/schemas/component-ref"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
    write-component-release:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              component:
                description: UUID of the component this release belongs to.
                $ref: "#/components/schemas/uuid"
              version:
                type: string
                description: Version of the release.
              releaseDate:
                $ref: "#/components/schemas/date-time"
              preRelease:
                type: boolean
                description: Whether this release is a pre-release.
              identifiers:
                type: array
                items:
                  $ref: "#/components/schemas/identifier"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
    write-publication-target:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            description: |
              `uuid` and `domain` are absent by design: the server assigns the
              first and derives the second from `rootUrl`, so the two cannot
              disagree about which server a target actually is.
            properties:
              rootUrl:
                type: string
                format: uri
                description: |
                  The remote server's TEA root, without a trailing slash. Must
                  be an absolute https URL — a mirror carries a credential, and
                  sending one over http would publish it to the network as well
                  as to the target.
              description:
                type: string
                description: What this target is, for whoever reviews the list later.
              credential:
                type: string
                writeOnly: true
                description: |
                  Bearer credential to present when publishing to the target.
                  Never returned by any operation.
            required:
              - rootUrl
    write-collection:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              updateReason:
                description: Why this version was published.
                $ref: "#/components/schemas/collection-update-reason"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
            required:
              - updateReason
    write-distribution:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            description: |
              `distributionId` is absent by design: the server assigns it, and
              a publisher-supplied identifier would let one tenant claim
              another's. It is derived from the release and the natural key
              below, so re-publishing the same download is an update.
            properties:
              description:
                type: string
                description: |
                  What this channel or format is, in terms a human choosing how
                  to install would recognise. Required when there is no `url`,
                  and used as the natural key in that case.
              url:
                type: string
                format: url
                description: |
                  Direct download URL. Must be absolute and http(s): a relative
                  path would resolve against the consumer's own origin, and
                  other schemes ask a consumer to do something it did not
                  request.
              signatureUrl:
                type: string
                format: url
                description: Direct download URL for the detached signature.
              identifiers:
                type: array
                description: |
                  Identifiers for this distribution specifically. Optional
                  because several real channels have no accepted purl type —
                  Homebrew and Scoop among them — and an identifier that names
                  a coordinate which does not resolve is worse than none, since
                  a consumer will follow it.
                items:
                  $ref: "#/components/schemas/identifier"
              checksums:
                type: array
                description: |
                  Recorded verbatim. This server does not hold the bytes and
                  cannot verify them, so these are the publisher's assertion,
                  not ours.
                items:
                  $ref: "#/components/schemas/checksum"
            anyOf:
              - required: [url]
              - required: [description]
    write-artifact:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              collection:
                description: |
                  UUID of the collection this artifact belongs to, which is the
                  UUID of its release.
                $ref: "#/components/schemas/uuid"
              name:
                type: string
                description: Human-readable name of the artifact.
              type:
                $ref: "#/components/schemas/artifact-type"
              formats:
                type: array
                description: |
                  The representations this artifact is published in. A format
                  may carry a `url` when the publisher hosts the bytes itself;
                  otherwise they are uploaded to this server afterwards.
                items:
                  $ref: "#/components/schemas/artifact-format"
              distributionIds:
                type: array
                description: |
                  The distributions this artifact describes. Absent or empty
                  means it applies to all of them, which is what the
                  consumption specification says of the same field.

                  It matters for exactly the case where an SBOM is not one
                  document: a Windows installer and a source tarball of the
                  same release have different contents, and an artifact that
                  cannot say which one it describes is attached to both
                  incorrectly.
                items:
                  $ref: "#/components/schemas/uuid"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
            required:
              - collection
              - name
              - formats
    update-artifact:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            description: |
              Metadata only. Stored bytes are immutable — replacing content
              means a new format or a new artifact, not an overwrite.
            properties:
              name:
                type: string
              type:
                $ref: "#/components/schemas/artifact-type"
              distributionIds:
                type: array
                description: |
                  Replaces the set of distributions this artifact describes.
                  An empty array means all of them.
                items:
                  $ref: "#/components/schemas/uuid"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"

tags:
  - name: TEA Publication
    description: |
      Operations that create, update and delete the objects the consumption API
      serves.
  - name: TEA Access Policy
    description: |
      Operations controlling who may read an object through the consumption
      API: the publishing organisation alone, named counterparties, or anyone.
  - name: TEA Publication Target
    description: |
      Registration of the remote TEA servers a publisher mirrors objects to.
      Mirroring is a copy the receiving server then governs, so the set of
      targets is configured deliberately rather than named in passing.
