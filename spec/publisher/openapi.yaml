jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
openapi: 3.1.1
info:
  title: Transparency Exchange API
  summary: Transparency Exchange API specification for consumers and publishers
  description: |
    The Transparency Exchange API (TEA) provides standardized access to software transparency artifacts such as SBOMs, VEX, VDR, and other attestations.
  contact:
    name: TEA Working Group
    url: https://github.com/CycloneDX/transparency-exchange-api
  license:
    name: Apache 2.0
    url: https://github.com/CycloneDX/transparency-exchange-api/blob/main/LICENSE
  version: 0.1.0-beta.1
servers:
  - url: https://{host}/tea/v{version}
    description: |
      A TEA server. `host` is the name a consumer reaches after resolving the
      domain component of a TEI and reading `/.well-known/tea`; `version` is one
      of the versions that document advertises for the chosen endpoint, so the
      publication and consumption APIs are addressed identically.
    variables:
      host:
        default: localhost
        description: Host serving the API.
      version:
        default: '1'
        description: TEA API version, without a leading `v`.
paths:
  /product/{uuid}:
    patch:
      summary: Update a TEA Product
      description: Update an existing TEA Product entry
      operationId: updateTeaProduct
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of TEA Product in the TEA server
          schema:
            type: string
            format: uuid
      requestBody:
        $ref: '#/components/requestBodies/UpdateTeaProduct'
      responses:
        '200':
          $ref: '#/components/responses/200-tea-product-updated'
        '400':
          $ref: '#/components/responses/400-invalid-request-body'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
      tags:
        - TEA Product
    delete:
      summary: Delete a TEA Product
      description: Delete a TEA Product entry
      operationId: deleteTeaProduct
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of TEA Product in the TEA server
          schema:
            type: string
            format: uuid
      responses:
        '204':
          $ref: '#/components/responses/204-object-deleted'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
      tags:
        - TEA Product
  /product:
    post:
      summary: Create a TEA Product
      description: Create TEA Product entry for the supplied product identifier
      operationId: createTeaProduct
      requestBody:
        $ref: '#/components/requestBodies/CreateTeaProduct'
      responses:
        '201':
          $ref: '#/components/responses/201-tea-product-created'
        '400':
          $ref: '#/components/responses/400-invalid-request-body'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
      tags:
        - TEA Product
  /component:
    post:
      summary: Create a TEA Component
      description: Create a new TEA Component entry
      operationId: createTeaComponent
      requestBody:
        $ref: '#/components/requestBodies/CreateTeaComponent'
      responses:
        '201':
          $ref: '#/components/responses/201-tea-component-created'
        '400':
          $ref: '#/components/responses/400-invalid-parameters'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
      tags:
        - TEA Component
  /component/{uuid}:
    patch:
      summary: Update a TEA Component
      description: Update an existing TEA Component entry
      operationId: updateTeaComponent
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of TEA Component in the TEA server
          schema:
            type: string
            format: uuid
      requestBody:
        $ref: '#/components/requestBodies/UpdateTeaComponent'
      responses:
        '200':
          $ref: '#/components/responses/200-tea-component-updated'
        '400':
          $ref: '#/components/responses/400-invalid-request-body'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
      tags:
        - TEA Component
    delete:
      summary: Delete a TEA Component
      description: Delete a TEA Component entry
      operationId: deleteTeaComponent
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of TEA Component in the TEA server
          schema:
            type: string
            format: uuid
      responses:
        '204':
          $ref: '#/components/responses/204-object-deleted'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
      tags:
        - TEA Component
  /release:
    post:
      summary: Create a TEA Release
      description: Create a new TEA Release
      operationId: createTeaRelease
      requestBody:
        $ref: '#/components/requestBodies/CreateTeaRelease'
      responses:
        '201':
          $ref: '#/components/responses/201-tea-release-created'
        '400':
          $ref: '#/components/responses/400-invalid-parameters'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
      tags:
        - TEA Release
  /release/{uuid}:
    patch:
      summary: Update a TEA Release
      description: Update an existing TEA Release entry
      operationId: updateTeaRelease
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of TEA Release in the TEA server
          schema:
            type: string
            format: uuid
      requestBody:
        $ref: '#/components/requestBodies/UpdateTeaRelease'
      responses:
        '200':
          $ref: '#/components/responses/200-tea-release-updated'
        '400':
          $ref: '#/components/responses/400-invalid-request-body'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
      tags:
        - TEA Release
    delete:
      summary: Delete a TEA Release
      description: Delete a TEA Release entry
      operationId: deleteTeaRelease
      parameters:
        - name: uuid
          in: path
          required: true
          description: UUID of TEA Release in the TEA server
          schema:
            type: string
            format: uuid
      responses:
        '204':
          $ref: '#/components/responses/204-object-deleted'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
      tags:
        - TEA Release
  /collection:
    post:
      summary: Create a TEA Collection
      description: Create a new TEA Collection
      operationId: createTeaCollection
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateTeaCollection'
      responses:
        '201':
          $ref: '#/components/responses/201-tea-collection-created'
        '400':
          $ref: '#/components/responses/400-invalid-request-body'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
        '409':
          $ref: '#/components/responses/409-conflict'
      tags:
        - TEA Collection
  /collection/{uuid}:
    patch:
      summary: Update a TEA Collection
      description: |
        Update a collection.

        A collection is the unit TEA versions, and its `updateReason` is how a
        consumer distinguishes a correction from a re-issue. A server MUST
        require an update reason on any change that alters the artifacts a
        collection publishes, because a collection that changes without saying
        why is indistinguishable from one that was tampered with.
      operationId: updateTeaCollection
      parameters:
        - $ref: '#/components/parameters/objectUuid'
      requestBody:
        $ref: '#/components/requestBodies/UpdateTeaCollection'
      responses:
        '200':
          $ref: '#/components/responses/200-tea-collection-updated'
        '400':
          $ref: '#/components/responses/400-invalid-request-body'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
        '409':
          $ref: '#/components/responses/409-conflict'
      tags:
        - TEA Collection
    delete:
      summary: Delete a TEA Collection
      description: Delete a collection and the artifact entries it holds.
      operationId: deleteTeaCollection
      parameters:
        - $ref: '#/components/parameters/objectUuid'
      responses:
        '204':
          $ref: '#/components/responses/204-object-deleted'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
      tags:
        - TEA Collection

  /artifact:
    post:
      summary: Create a TEA Artifact
      description: |
        Create an artifact entry within a collection.

        This registers the artifact and its formats; it does not carry the
        bytes. Content is uploaded per format through
        `/artifact/{uuid}/format/{formatIndex}/content`, or referenced by URL
        when the publisher hosts it elsewhere. Separating the two matters
        because an SBOM is routinely tens of megabytes, and a publisher that
        must resend all of it to correct one field will eventually not correct
        the field.
      operationId: createTeaArtifact
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateTeaArtifact'
      responses:
        '201':
          $ref: '#/components/responses/201-tea-artifact-created'
        '400':
          $ref: '#/components/responses/400-invalid-request-body'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
        '409':
          $ref: '#/components/responses/409-conflict'
      tags:
        - TEA Artifact
  /artifact/{uuid}:
    patch:
      summary: Update a TEA Artifact
      description: |
        Update an artifact's metadata.

        Stored bytes are immutable: a checksum a consumer has already recorded
        must not start describing different content. Replacing content means
        adding a new format or a new artifact version, never rewriting one in
        place.
      operationId: updateTeaArtifact
      parameters:
        - $ref: '#/components/parameters/objectUuid'
      requestBody:
        $ref: '#/components/requestBodies/UpdateTeaArtifact'
      responses:
        '200':
          $ref: '#/components/responses/200-tea-artifact-updated'
        '400':
          $ref: '#/components/responses/400-invalid-request-body'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
        '409':
          $ref: '#/components/responses/409-conflict'
      tags:
        - TEA Artifact
    delete:
      summary: Delete a TEA Artifact
      description: Delete an artifact entry and any content this server holds for it.
      operationId: deleteTeaArtifact
      parameters:
        - $ref: '#/components/parameters/objectUuid'
      responses:
        '204':
          $ref: '#/components/responses/204-object-deleted'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
      tags:
        - TEA Artifact
  /artifact/{uuid}/format/{formatIndex}/content:
    put:
      summary: Upload artifact content
      description: |
        Upload the bytes of one artifact format.

        The body is the artifact itself, sent with its own media type rather
        than wrapped in JSON or base64 — an SBOM is already a document, and
        re-encoding it inflates it by a third for no benefit.

        A client SHOULD send `Content-Digest`. Where it does, the server MUST
        verify the digest against the received bytes and reject a mismatch with
        `CHECKSUM_MISMATCH`. This is what makes an upload safe to retry: a
        truncated transfer fails loudly instead of publishing a corrupt artifact
        under a checksum that says otherwise.
      operationId: uploadTeaArtifactContent
      parameters:
        - $ref: '#/components/parameters/objectUuid'
        - $ref: '#/components/parameters/formatIndex'
        - $ref: '#/components/parameters/contentDigest'
      requestBody:
        required: true
        description: The artifact bytes, in the media type declared by the format.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          application/vnd.cyclonedx+json:
            schema:
              type: string
              format: binary
          application/spdx+json:
            schema:
              type: string
              format: binary
          application/sarif+json:
            schema:
              type: string
              format: binary
      responses:
        '200':
          $ref: '#/components/responses/200-tea-artifact-updated'
        '400':
          $ref: '#/components/responses/400-invalid-request-body'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
        '413':
          $ref: '#/components/responses/413-payload-too-large'
        '415':
          $ref: '#/components/responses/415-unsupported-media-type'
      tags:
        - TEA Artifact
  /artifact/{uuid}/format/{formatIndex}/signature:
    put:
      summary: Attach a detached signature
      description: |
        Attach a detached signature to one artifact format, declaring the scheme
        it was produced with.

        The consumption API exposes a `signatureUrl` and nothing else, so a
        consumer is left to infer the scheme from the bytes. Recording it here
        is what turns a signature from something that exists into something that
        can be checked.
      operationId: uploadTeaArtifactSignature
      parameters:
        - $ref: '#/components/parameters/objectUuid'
        - $ref: '#/components/parameters/formatIndex'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/artifactSignature'
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: |
                The raw detached signature. The scheme MUST then be supplied in
                the `X-TEA-Signature-Type` header, since bytes alone do not say
                how to verify them.
      responses:
        '200':
          $ref: '#/components/responses/200-tea-artifact-updated'
        '400':
          $ref: '#/components/responses/400-invalid-request-body'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
        '415':
          $ref: '#/components/responses/415-unsupported-media-type'
      tags:
        - TEA Artifact

  /distribution/{uuid}:
    get:
      summary: Read effective distribution
      description: |
        The distribution actually in force for an object, after inheritance.

        A publisher needs to be able to answer "who can see this?" without
        replaying the object tree in their head. The response reports both what
        the object declares and what it inherits, because the difference between
        the two is exactly where accidental disclosure hides.
      operationId: getTeaDistribution
      parameters:
        - $ref: '#/components/parameters/objectUuid'
      responses:
        '200':
          $ref: '#/components/responses/200-tea-distribution'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
      tags:
        - TEA Distribution
    put:
      summary: Set distribution
      description: |
        Set an object's own distribution, replacing any it previously declared.

        A server MUST reject a distribution that is wider than the effective
        distribution of the object's parent, with `DISTRIBUTION_WIDENS_PARENT`.
        A server SHOULD require a distinct confirmation for a change to
        `public`, because that transition cannot be undone by any later request:
        whatever was fetched while it was public stays fetched.
      operationId: setTeaDistribution
      parameters:
        - $ref: '#/components/parameters/objectUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/distribution'
      responses:
        '200':
          $ref: '#/components/responses/200-tea-distribution'
        '400':
          $ref: '#/components/responses/400-invalid-request-body'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '404':
          $ref: '#/components/responses/404-object-by-id-not-found'
        '409':
          $ref: '#/components/responses/409-conflict'
      tags:
        - TEA Distribution
components:
  schemas:
    error:
      type: object
      description: |
        A machine-readable error. Publication is an automated activity — a
        release pipeline is usually the caller — so a failure has to be
        actionable without a human reading prose.
      properties:
        code:
          type: string
          description: Stable, machine-readable reason. Clients branch on this, never on `message`.
          enum:
            - INVALID_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - OBJECT_NOT_FOUND
            - DUPLICATE_OBJECT
            - VERSION_CONFLICT
            - DISTRIBUTION_WIDENS_PARENT
            - UNSUPPORTED_MEDIA_TYPE
            - PAYLOAD_TOO_LARGE
            - CHECKSUM_MISMATCH
            - SIGNATURE_INVALID
        message:
          type: string
          description: Human-readable explanation. Not a stable interface.
        field:
          type: string
          description: JSON Pointer to the offending member of the request body, where one applies.
      required:
        - code
        - message

    distribution:
      type: object
      description: |
        Who may read an object through the consumption API.

        TEA describes how transparency data is *fetched*, not who is entitled to
        fetch it, which leaves every publisher to invent an answer. A publisher
        API cannot avoid the question: the same server holds material that is
        deliberately public, material shared with named counterparties under an
        agreement, and material that is purely internal.

        Distribution is resolved by inheritance. An object with no distribution
        of its own takes its parent's — artifact from collection, collection
        from release, release from product. An object MAY narrow what it
        inherits and MUST NOT widen it: a server MUST reject with
        `DISTRIBUTION_WIDENS_PARENT` any request that would make a child more
        visible than its parent. Without that rule, publishing a product
        privately would be no guarantee at all, because any artifact beneath it
        could quietly be made public.
      properties:
        visibility:
          type: string
          description: |
            `private` — only the publishing organisation may read it.

            `shared` — readable by the publishing organisation and by the
            organisations named in `sharedWith`. Authentication is required and
            the reader's identity decides the answer.

            `public` — readable without authentication. This is the only value
            that makes an object part of the open transparency web, and it is
            irreversible in practice: what has been fetched cannot be recalled.
          enum:
            - private
            - shared
            - public
          default: private
        sharedWith:
          type: array
          description: |
            Organisations entitled to read this object when `visibility` is
            `shared`. Identified by the consuming organisation's UUID on this
            server. MUST be empty for any other visibility, so that a later
            change to `private` cannot silently leave a grant in place.
          items:
            $ref: '#/components/schemas/shareGrant'
        publishTo:
          type: array
          description: |
            Remote TEA servers this object is mirrored to. Mirroring is a copy,
            not a reference: once an object reaches another server, this
            server's distribution no longer governs it.
          items:
            $ref: '#/components/schemas/publicationTarget'
      required:
        - visibility

    shareGrant:
      type: object
      description: An entitlement for one organisation to read one object.
      properties:
        organizationUuid:
          type: string
          format: uuid
          description: The consuming organisation's UUID on this server.
        organizationName:
          type: string
          description: Display name at the time of granting. Advisory; the UUID is the identity.
        grantedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: |
            When the grant lapses. A grant for the duration of an evaluation or
            a contract is the common case, and a server that cannot express an
            expiry pushes publishers towards grants nobody ever revokes.
      required:
        - organizationUuid

    publicationTarget:
      type: object
      description: A remote TEA server this publisher mirrors objects to.
      properties:
        uuid:
          type: string
          format: uuid
          description: Identifier of a target already configured on this server.
        domain:
          type: string
          description: |
            The TEI domain-name component of the target, which is what a
            consumer resolves. Reported so a publisher can see where a copy
            went without holding the target's credentials.
        state:
          type: string
          description: State of the most recent mirroring attempt for this object.
          enum:
            - pending
            - published
            - failed
        lastAttemptAt:
          type: string
          format: date-time
        detail:
          type: string
          description: Why the last attempt failed, when it did.
      required:
        - uuid

    artifactSignature:
      type: object
      description: |
        A detached signature over an artifact format's bytes.

        The consumption API exposes only a `signatureUrl`, which tells a
        consumer where a signature lives but not what it is, so verifying one
        means guessing the scheme. A publisher knows, and stating it here is
        what makes the signature checkable rather than merely present.
      properties:
        signatureType:
          type: string
          description: The signature scheme, so a consumer knows how to verify rather than having to guess.
          enum:
            - jws
            - cose
            - pgp
            - x509-cms
            - sigstore-bundle
            - ssh
        url:
          type: string
          format: url
          description: Direct download URL for the detached signature.
        keyId:
          type: string
          description: Key identifier the signature was produced with, where the scheme has one.
        certificateUrl:
          type: string
          format: url
          description: Signing certificate or chain, where verification needs one.
        transparencyLogUrl:
          type: string
          format: url
          description: |
            Entry in a signature transparency log, such as Rekor. A signature
            that is itself publicly logged is far harder to backdate.
        signedAt:
          type: string
          format: date-time
      required:
        - signatureType
        - url

    identifier:
      type: object
      description: An identifier with a specified type
      properties:
        idType:
          description: Type of identifier, e.g. `tei`, `purl`, `cpe`, `swid`
          type: string
          enum:
            - cpe
            - tei
            - purl
            - swid
        idValue:
          description: Identifier value
          type: string
      required:
        - idType
        - idValue
    artifactChecksum:
      type: object
      properties:
        algType:
          description: Checksum algorithm
          type: string
          enum:
            - SHA-256
            - SHA-384
            - SHA-512
            - SHA3-256
            - SHA3-384
            - SHA3-512
            - BLAKE2b-256
            - BLAKE2b-384
            - BLAKE2b-512
            - BLAKE3
        algValue:
          type: string
          description: Checksum value
      required:
        - algType
        - algValue
    product:
      type: object
      properties:
        identifier:
          $ref: '#/components/schemas/typeUuid'
          description: A unique identifier for the TEA product
        name:
          type: string
          description: Product name
        barcode:
          type: string
          description: Barcode
        sku:
          type: string
          description: Product SKU
        vendorUuid:
          $ref: '#/components/schemas/typeUuid'
          description: Vendor UUID
        identifiers:
          type: array
          description: List of identifiers for the product
          items:
            $ref: '#/components/schemas/identifier'
        type:
          $ref: '#/components/schemas/typePackage'
          description: Product type
        namespace:
          type: string
          description: Product namespace (optional)
        version:
          type: string
          description: Product version (optional)
        qualifiers:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
          description: Array of qualifier objects containing related key-value pairs (optional)
        subpath:
          type: string
          description: Subpath (optional)
        components:
          type: array
          description: List of TEA component UUIDs
          items:
            $ref: '#/components/schemas/typeUuid'
      required:
        - identifier
        - name
        - identifiers
        - components
    component:
      type: object
      description: A TEA component
      properties:
        uuid:
          description: A unique identifier for the TEA component
          $ref: '#/components/schemas/typeUuid'
        name:
          type: string
          description: Component name
        identifiers:
          type: array
          description: List of identifiers for the component
          items:
            $ref: '#/components/schemas/identifier'
        versions:  # Added to match consumer schema requirements
          type: array
          description: List of available versions for this component
          items:
            type: string
        releases:
          type: array
          description: List of UUIDs referencing TEA Release entries
          items:
            $ref: '#/components/schemas/typeUuid'
      required:
        - uuid
        - name
        - identifiers
        - versions
    release:
      type: object
      description: A TEA release
      properties:
        uuid:
          description: A unique identifier for the TEA Component Release
          $ref: '#/components/schemas/typeUuid'
        version:
          description: Version number
          type: string
          example: 1.2.3
        releaseDate:
          description: Timestamp of the release (for sorting purposes)
          type: string
          format: date-time
          example: '2024-03-20T15:30:00Z'
        preRelease:
          type: boolean
          description: A flag indicating pre-release (or beta) status
        identifiers:
          type: array
          description: List of identifiers for the component
          items:
            $ref: '#/components/schemas/identifier'
        collectionReferences:
          type: array
          items:
            $ref: '#/components/schemas/typeUuid'
          description: Array of UUIDs referencing TEA Collection entries
          default: []
      required:
        - uuid
        - version
        - releaseDate
    collectionUpdateReason:
      type: object
      description: Reason for the update to the TEA collection
      properties:
        type:
          description: Type of update reason
          type: string
          enum:
            - INITIAL_RELEASE
            - VEX_UPDATED
            - ARTIFACT_UPDATED
            - ARTIFACT_ADDED
            - ARTIFACT_REMOVED
        comment:
          type: string
          description: Free text description
      required:
        - type
    collection:
      type: object
      description: A collection of security-related documents
      properties:
        uuid:
          description: |
            UUID of the TEA Collection object. Note that this is equal to the UUID of the associated TEA Release object.
          $ref: '#/components/schemas/typeUuid'
        version:
          type: integer
          description: TEA Collection version, incremented each time its content changes. Versions start with 1.
          minimum: 1
        releaseDate:
          description: The date when the TEA Collection version was created.
          type: string
          format: date-time
          example: '2024-03-20T15:30:00Z'
        updateReason:
          description: Reason for the update/release of the TEA Collection object.
          $ref: '#/components/schemas/collectionUpdateReason'
        artifacts:
          type: array
          description: List of TEA artifact objects.
          items:
            $ref: '#/components/schemas/artifact'
      required:
        - uuid
        - version
        - releaseDate
        - updateReason
    artifact:
      type: object
      description: A security-related document
      properties:
        uuid:
          description: UUID of the TEA Artifact object.
          $ref: '#/components/schemas/typeUuid'
        name:
          type: string
          description: Artifact name
        type:
          description: Type of artifact
          $ref: '#/components/schemas/typeCollectionArtifactType'
        author:
          $ref: '#/components/schemas/typeAuthor'
          description: Author of the artifact
        formats:
          type: array
          description: List of objects with the same content, but in different formats.
          items:
            $ref: '#/components/schemas/artifactFormat'
      required:
        - uuid
        - name
        - type
        - author
        - formats
    artifactFormat:
      type: object
      description: A security-related document in a specific format
      properties:
        mimeType:
          type: string
          description: The MIME type of the document
        description:
          type: string
          description: A free text describing the artifact
        url:  # Changed from artifactUrl to match consumer
          type: string
          format: uri
          description: Direct download URL for the artifact
        signatureUrl:  # Already matches consumer
          type: string
          format: uri
          description: Direct download URL for an external signature of the artifact
        checksums:  # Changed from artifactChecksums to match consumer
          type: array
          items:
            $ref: '#/components/schemas/artifactChecksum'
          description: List of checksums for the artifact
      required:
        - mimeType
        - description
        - url
        - checksums
    typeAuthor:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        organization:
          type: string
      required:
        - name
        - email
        - organization
    typeCollectionArtifactType:
      type: string
      title: Type
      description: Specifies the type of external reference.
      enum:
        - ATTESTATION
        - BOM
        - BUILD_META
        - CERTIFICATION
        - FORMULATION
        - LICENSE
        - RELEASE_NOTES
        - SECURITY_TXT
        - THREAT_MODEL
        - VULNERABILITIES
        - OTHER
    typeUuid:
      type: string
      format: uuid
    typePackage:
      type: string
      description: Package type following PURL specification
      enum:
        - alpm
        - apk
        - bitbucket
        - bitnami
        - cargo
        - cocoapods
        - composer
        - conan
        - conda
        - cpan
        - cran
        - deb
        - docker
        - gem
        - generic
        - github
        - golang
        - hackage
        - hex
        - huggingface
        - luarocks
        - maven
        - mlflow
        - npm
        - nuget
        - oci
        - pub
        - pypi
        - qpkg
        - rpm
        - swid
        - swift
  responses:
    204-object-deleted:
      description: |
        The object was deleted and is no longer resolvable through the
        consumption API.

        Deletion does not retract what consumers already hold. An object that
        was published outside this server SHOULD also be withdrawn through a CLE
        `withdrawn` event, so a consumer who acted on it can learn that it was
        retracted rather than simply finding it gone.
    409-conflict:
      description: |
        The request conflicts with the current state of the object: a create
        that would duplicate an existing natural key, an update against a
        version that has since been superseded, or a distribution change that
        would make an object more visible than the object it belongs to.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    413-payload-too-large:
      description: The uploaded artifact or signature exceeds the size this server accepts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    415-unsupported-media-type:
      description: The supplied media type is not one this server accepts for the object.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    403-forbidden:
      description: |
        Authenticated, but not entitled to perform this operation on this
        object. Distinct from 401 on purpose: a publisher debugging a pipeline
        needs to know whether the credential was rejected or the permission was.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    200-tea-collection-updated:
      description: TEA Collection updated successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/collection'
    201-tea-artifact-created:
      description: TEA Artifact created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/artifact'
    200-tea-artifact-updated:
      description: TEA Artifact updated successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/artifact'
    200-tea-distribution:
      description: The distribution in force for the object
      content:
        application/json:
          schema:
            type: object
            properties:
              uuid:
                type: string
                format: uuid
                description: The object the distribution applies to.
              declared:
                description: |
                  What this object sets for itself. Absent when the object
                  declares nothing and relies entirely on inheritance.
                $ref: '#/components/schemas/distribution'
              effective:
                description: What is actually enforced, after inheritance.
                $ref: '#/components/schemas/distribution'
              inheritedFrom:
                type: string
                format: uuid
                description: |
                  The ancestor the effective distribution came from, when it was
                  not declared on this object. Naming it is what lets a
                  publisher fix the cause rather than the symptom.
            required:
              - uuid
              - effective
    200-tea-product-updated:
      description: TEA Product updated successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/product'
    200-tea-component-updated:
      description: TEA Component updated successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/component'
    200-tea-release-updated:
      description: TEA Release updated successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/release'
    201-tea-product-created:
      description: Product created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              identifier:
                $ref: '#/components/schemas/typeUuid'
                description: Unique identifier for the created product
              name:
                type: string
                description: Product name
              barcode:
                type: string
                description: Barcode
              sku:
                type: string
                description: Product SKU
              vendorUuid:
                $ref: '#/components/schemas/typeUuid'
                description: Vendor UUID
              identifiers:
                type: array
                items:
                  $ref: '#/components/schemas/identifier'
                description: List of identifiers for the product (TEI, CPE, SWID, etc.)
              type:
                $ref: '#/components/schemas/typePackage'
                description: Product type
              namespace:
                type: string
                description: Product namespace (optional)
              version:
                type: string
                description: Product version (optional)
              qualifiers:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
                description: Array of qualifier objects containing related key-value pairs (optional)
              subpath:
                type: string
                description: Subpath (optional)
            required:
              - identifier
              - name
    201-tea-component-created:
      description: TEA Component created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/component'
    201-tea-release-created:
      description: TEA Release created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/release'
    201-tea-collection-created:
      description: TEA Collection created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/collection'
    400-invalid-request-body:
      description: Invalid request body
      content:
        application/json: {}
    400-invalid-parameters:
      description: Invalid parameters
      content:
        application/json: {}
    401-unauthorized:
      description: Authentication required
      content:
        application/json: {}
    404-object-by-id-not-found:
      description: Object requested by identifier not found
      content:
        application/json: {}
  parameters:
    objectUuid:
      name: uuid
      in: path
      required: true
      description: UUID of the object in the TEA server.
      schema:
        type: string
        format: uuid
    formatIndex:
      name: formatIndex
      in: path
      required: true
      description: |
        Zero-based index of the format within the artifact's `formats` array.
        Formats are addressed positionally because a media type is not unique
        within an artifact — the same document is often published both
        compressed and not.
      schema:
        type: integer
        minimum: 0
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-chosen key making a create safe to retry.

        Publication runs in release pipelines, which retry. Without this, a
        timeout that actually succeeded produces a second product on the next
        attempt, and the duplicate is discovered by a consumer rather than by
        the publisher. A server that supports the key MUST return the original
        result for a repeat of the same key rather than creating again.
      schema:
        type: string
        maxLength: 255
    contentDigest:
      name: Content-Digest
      in: header
      required: false
      description: |
        Digest of the request body, per RFC 9530, e.g. `sha-256=:<base64>:`.
        Where supplied, the server MUST verify it against the bytes received and
        reject a mismatch rather than storing content that does not match the
        checksum it will be published under.
      schema:
        type: string
    page-offset:
      name: pageOffset
      description: Pagination offset
      in: query
      required: false
      schema:
        type: integer
        format: int64
        default: 0
    pageSize:
      name: pageSize
      description: Pagination size
      in: query
      required: false
      schema:
        type: integer
        format: int64
        default: 100
    teiUrn:
      name: teiUrn
      description: Transparency Exchange Identifier (URN)
      in: path
      required: true
      schema:
        type: string
        pattern: ^urn:tei:[a-zA-Z0-9]+:[a-zA-Z0-9\.-]+:.+$
    productIdentifier:
      name: productIdentifier
      description: Customer unique Product Identifier
      in: path
      required: true
      schema:
        type: string
        format: uuid
    collectionIdentifier:
      name: collectionIdentifier
      description: TEA Collection Identifier
      in: path
      required: true
      schema:
        type: string
        format: uuid
    barcode:
      name: barcode
      description: Barcode
      in: query
      required: false
      schema:
        type: string
    sku:
      name: sku
      description: Product SKU
      in: query
      required: false
      schema:
        type: string
    vendorUuid:
      name: vendorUuid
      description: Vendor UUID
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/typeUuid'
    idType:
      name: idType
      description: Type of identifier specified in the `idValue` parameter
      in: query
      schema:
        type: string
        enum:
          - cpe
          - tei
          - purl
    id-value:
      name: idValue
      description: If present, only the objects with the given identifier value will be returned
      in: query
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication is a stateless authentication scheme where the client sends a token in the HTTP Authorization header.
        The server validates the token and grants access to the requested resource to anyone with the token without needing to authenticate
        again, and stolen tokens can be used by anyone.
    basicAuth:
      type: http
      scheme: basic
      description: |
        Basic authentication is a plaintext scheme built into the HTTP protocol and has been deemed insecure because headers are commonly
        logged in plaintext.
    mutualTLS:
      type: mutualTLS
      description: |
        Client certificate authentication is a secure authentication scheme where the client presents a valid certificate to the server
        for authentication. The server validates the certificate and grants access to the requested resource, but stolen certificates can be
        used by anyone.
    pasetoAuth:
      type: http
      scheme: bearer
      bearerFormat: PASETO
      description: |
        Platform-Agnostic Security Tokens (PASETO) is a secure alternative to JWT that is resistant to many cryptographic vulnerabilities.
        PASETO tokens use versioned protocols that specify modern cryptographic algorithms.
    verifiableCredentials:
      type: http
      scheme: bearer
      bearerFormat: VC-JWT
      description: |
        W3C Verifiable Credentials 2.0 with proof field is a standard for expressing verifiable credentials as signed JWT tokens.
        The integrity and authenticity of the credential can be cryptographically verified.
    hmacAuth:
      type: apiKey
      in: header
      name: X-HMAC-Signature
      description: |
        HMAC authentication uses a shared secret key to create a signature of the request content using a secure hash algorithm (SHA256,
        SHA384, SHA512, SHA3-256, SHA3-384, or SHA3-512). The server verifies this signature to authenticate the request.
  requestBodies:
    UpdateTeaCollection:
      required: true
      content:
        application/json:
          schema:
            type: object
