    publisher-error-type:
      type: string
      description: |
        Classification of a publication error.

        Extends the consumption specification's `unknown-error-type` with the
        failures only a writer can hit. The two consumption values are repeated
        so a client can branch on one enumeration rather than two.
      enum:
        - OBJECT_UNKNOWN
        - OBJECT_NOT_SHAREABLE
        - INVALID_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - DUPLICATE_OBJECT
        - VERSION_CONFLICT
        - ACCESS_WIDENS_PARENT
        - UNSUPPORTED_MEDIA_TYPE
        - PAYLOAD_TOO_LARGE
        - CHECKSUM_MISMATCH
        - SIGNATURE_INVALID
    publisher-error-response:
      type: object
      description: |
        A publication error. Same envelope as the consumption specification's
        `error-response`, over the wider publication enumeration, with an
        optional human-readable message and a pointer to the offending field.

        Publication is automated — a release pipeline is usually the caller —
        so a failure has to be actionable without a human reading prose.
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/publisher-error-type"
        message:
          type: string
          description: Human-readable explanation. Not a stable interface; branch on `error`.
        field:
          type: string
          description: JSON Pointer to the offending member of the request body, where one applies.
      required:
        - error
    access-policy:
      type: object
      description: |
        Who may read an object through the consumption API.

        TEA describes how transparency data is fetched, not who is entitled to
        fetch it. That is a reasonable boundary for a consumption API and an
        impossible one for a publication API, where the same server holds
        material that is deliberately public, material shared with named
        counterparties under agreement, and material that is purely internal.
        Absent this, every publisher invents an answer, incompatibly.

        Resolved by inheritance: an artifact takes its collection's policy, a
        collection its release's, a release its product's. An object MAY narrow
        what it inherits and MUST NOT widen it — a server rejects the attempt
        with `ACCESS_WIDENS_PARENT`. Without that rule, marking a product
        private would guarantee nothing, because any artifact beneath it could
        quietly be made public.

        A consumer denied by this policy is answered with the consumption
        specification's existing `OBJECT_NOT_SHAREABLE`, so enforcement needs
        no new consumer-side behaviour.
      additionalProperties: false
      properties:
        visibility:
          type: string
          description: |
            `private` — only the publishing organisation may read it.

            `shared` — readable by the publishing organisation and the
            organisations named in `sharedWith`. Authentication is required and
            the reader's identity decides the answer.

            `public` — readable without authentication. The only value that
            makes an object part of the open transparency web, and irreversible
            in practice: what has been fetched cannot be recalled.
          enum:
            - private
            - shared
            - public
          default: private
        sharedWith:
          type: array
          description: |
            Organisations entitled to read this object when `visibility` is
            `shared`. MUST be empty for any other visibility, so that a later
            change to `private` cannot silently leave a grant standing.
          items:
            $ref: "#/components/schemas/share-grant"
        publishTo:
          type: array
          description: |
            Remote TEA servers this object is mirrored to. Mirroring is a copy,
            not a reference: once an object reaches another server, this
            server's policy no longer governs it.
          items:
            $ref: "#/components/schemas/publication-target"
      required:
        - visibility
    share-grant:
      type: object
      description: An entitlement for one organisation to read one object.
      additionalProperties: false
      properties:
        organizationUuid:
          description: The consuming organisation's identifier on this server.
          $ref: "#/components/schemas/uuid"
        organizationName:
          type: string
          description: Display name when the grant was made. Advisory; the UUID is the identity.
        grantedAt:
          $ref: "#/components/schemas/date-time"
        expiresAt:
          description: |
            When the grant lapses. A grant for the length of an evaluation or a
            contract is the common case, and a server that cannot express an
            expiry pushes publishers towards grants nobody ever revokes.
          $ref: "#/components/schemas/date-time"
      required:
        - organizationUuid
    publication-target:
      type: object
      description: A remote TEA server this publisher mirrors objects to.
      additionalProperties: false
      properties:
        uuid:
          description: Identifier of a target already configured on this server.
          $ref: "#/components/schemas/uuid"
        domain:
          type: string
          description: |
            The TEI domain-name component of the target, which is what a
            consumer resolves. Reported so a publisher can see where a copy
            went without holding the target's credentials.
        state:
          type: string
          description: State of the most recent mirroring attempt for this object.
          enum:
            - pending
            - published
            - failed
        lastAttemptAt:
          $ref: "#/components/schemas/date-time"
        detail:
          type: string
          description: Why the last attempt failed, when it did.
      required:
        - uuid
    artifact-signature:
      type: object
      description: |
        A detached signature over an artifact format's bytes.

        signatures/signature.md calls for an indication of the hash algorithm,
        an indicator of the certificate used, and the intermediate and signing
        certificates. This carries them, plus the transparency-log entry where
        the scheme has one — a signature that is itself publicly logged is far
        harder to backdate.
      additionalProperties: false
      properties:
        signatureType:
          type: string
          description: The scheme, so a consumer knows how to verify rather than having to guess.
          enum:
            - jws
            - jsf
            - cose
            - pgp
            - x509-cms
            - sigstore-bundle
            - ssh
        url:
          type: string
          format: url
          description: Direct download URL for the detached signature.
        algorithm:
          type: string
          description: Hash algorithm the signature was computed over, e.g. SHA-256.
        keyId:
          type: string
          description: Key identifier the signature was produced with, where the scheme has one.
        certificateUrl:
          type: string
          format: url
          description: Signing certificate, where verification needs one.
        certificateChainUrl:
          type: string
          format: url
          description: Intermediate certificates between the signing certificate and a trusted root.
        transparencyLogUrl:
          type: string
          format: url
          description: Entry in a signature transparency log, such as Rekor.
        signedAt:
          $ref: "#/components/schemas/date-time"
      required:
        - signatureType
        - url
    access-policy-status:
      type: object
      description: An object's declared access policy alongside the one actually enforced.
      additionalProperties: false
      properties:
        uuid:
          description: The object the policy applies to.
          $ref: "#/components/schemas/uuid"
        declared:
          description: |
            What this object sets for itself. Absent when it declares nothing
            and relies entirely on inheritance.
          $ref: "#/components/schemas/access-policy"
        effective:
          description: What is enforced, after inheritance.
          $ref: "#/components/schemas/access-policy"
        inheritedFrom:
          description: |
            The ancestor the effective policy came from, when it was not
            declared here. Naming it lets a publisher fix the cause rather than
            the symptom.
          $ref: "#/components/schemas/uuid"
      required:
        - uuid
        - effective
  responses:
    204-common-delete:
      description: Object deleted successfully
      content:
        application/json: {}
    400-invalid-request:
      description: Request was Invalid
      content:
        application/json: {}
    401-unauthorized:
      description: Authentication required
      content:
        application/json: {}
    404-object-by-id-not-found:
      description: Object requested by identifier not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-response"
    discovery-response:
      description: Discovery information for the requested TEI
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/discovery-info"
    paginated-product:
      description: A paginated response containing TEA Products
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-product-response"
    paginated-product-release:
      description: A paginated response containing TEA Product Releases
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-product-release-response"
    paginated-component:
      description: A paginated response containing TEA Components
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-component-response"
    paginated-component-release:
      description: A paginated response containing TEA Component Releases
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-component-release-response"
    paginated-collection:
      description: A paginated response containing TEA Collections
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/paginated-collection-response"
    object-deleted:
      description: |
        The object was deleted and is no longer resolvable through the
        consumption API.
    publisher-bad-request:
      description: The request body is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-unauthorized:
      description: Authentication is required, or the credential was rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-forbidden:
      description: |
        Authenticated, but not entitled to perform this operation on this
        object. Distinct from 401 on purpose: a publisher debugging a pipeline
        needs to know whether the credential was rejected or the permission
        was.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-not-found:
      description: No such object, or the caller may not see it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-conflict:
      description: |
        The request conflicts with the object's current state: a create that
        would duplicate an existing natural key, an update against a version
        since superseded, or an access policy wider than the object's parent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-payload-too-large:
      description: The uploaded content exceeds the size this server accepts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    publisher-unsupported-media-type:
      description: The supplied media type is not one this server accepts for the object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/publisher-error-response"
    product-written:
      description: The product as the consumption API will serve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/product"
    component-written:
      description: The component as the consumption API will serve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/component"
    product-release-written:
      description: The product release as the consumption API will serve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/productRelease"
    component-release-written:
      description: The component release as the consumption API will serve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/release"
    collection-written:
      description: The newly published collection version.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/collection"
    artifact-written:
      description: The artifact as the consumption API will serve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/artifact"
    distribution-written:
      description: The distribution as the consumption API will serve it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/release-distribution"
    access-policy-read:
      description: The access policy in force for the object.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/access-policy-status"
  parameters:
    page-size:
      name: pageSize
      description: The maximum number of results to return.
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
        default: 25
    page-token:
      name: pageToken
      description: |
        An opaque token used to retrieve the next page of results. 
        This should be copied exactly from the `nextPageToken` field of a previous response.
      in: query
      required: false
      schema:
        type: string
    sort-order:
      name: sortOrder
      description: The direction of the sort.
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    sort-field-collection:
      name: sortField
      description: The field by which to sort the results.
      in: query
      required: false
      schema:
        type: string
        enum:
          - version
        default: version
    sort-field-component:
      name: sortField
      description: The field by which to sort the results.
      in: query
      required: false
      schema:
        type: string
        enum:
          - name
        default: name
    sort-field-component-release:
      name: sortField
      description: The field by which to sort the results.
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdDate
          - releaseDate
          - version
        default: createdDate
    sort-field-product:
      name: sortField
      description: The field by which to sort the results.
      in: query
      required: false
      schema:
        type: string
        enum:
          - name
        default: name
    sort-field-product-release:
      name: sortField
      description: The field by which to sort the results.
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdDate
          - releaseDate
          - version
        default: createdDate
    id-type:
      name: idType
      description: Type of identifier specified in the `idValue` parameter
      in: query
      schema:
        $ref: "#/components/schemas/identifier-type"
    id-value:
      name: idValue
      description: If present, only the objects with the given identifier value will be returned.
      in: query
      schema:
        type: string
    object-uuid:
      name: uuid
      in: path
      required: true
      description: UUID of the object.
      schema:
        $ref: "#/components/schemas/uuid"
    artifact-uuid:
      name: uuid
      in: path
      required: true
      description: UUID of the TEA Artifact.
      schema:
        $ref: "#/components/schemas/uuid"
    format-index:
      name: formatIndex
      in: path
      required: true
      description: |
        Zero-based index of the format within the artifact's `formats` array.
        Formats are addressed positionally because a media type is not unique
        within an artifact — the same document is often published both
        compressed and not.
      schema:
        type: integer
        minimum: 0
    idempotency-key:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A client-chosen key that makes a create safe to retry.

        Publication runs in release pipelines, and pipelines retry. Without
        this, a timeout that actually succeeded produces a second object on the
        next attempt — a duplicate discovered by a consumer rather than by the
        publisher. A server supporting the key MUST return the original result
        for a repeat of the same key rather than creating again.
      schema:
        type: string
        maxLength: 255
    content-digest:
      name: Content-Digest
      in: header
      required: false
      description: |
        Digest of the request body per RFC 9530, e.g. `sha-256=:<base64>:`.
        Where supplied, the server MUST verify it against the bytes received
        and reject a mismatch rather than storing content that does not match
        the checksum it will be published under.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic
  requestBodies:
    write-product:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: Product name.
              identifiers:
                type: array
                description: |
                  Identifiers for the product. A server assigns the TEI itself
                  — it names the server's own authority over the object, so a
                  publisher supplying one would be asserting something only the
                  server can know.
                items:
                  $ref: "#/components/schemas/identifier"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
    write-component:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: Component name.
              identifiers:
                type: array
                items:
                  $ref: "#/components/schemas/identifier"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
    write-product-release:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              product:
                description: UUID of the product this release belongs to.
                $ref: "#/components/schemas/uuid"
              version:
                type: string
                description: Version of the release.
              releaseDate:
                $ref: "#/components/schemas/date-time"
              preRelease:
                type: boolean
                description: Whether this release is a pre-release.
              identifiers:
                type: array
                items:
                  $ref: "#/components/schemas/identifier"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
    write-component-release:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              component:
                description: UUID of the component this release belongs to.
                $ref: "#/components/schemas/uuid"
              version:
                type: string
                description: Version of the release.
              releaseDate:
                $ref: "#/components/schemas/date-time"
              preRelease:
                type: boolean
                description: Whether this release is a pre-release.
              identifiers:
                type: array
                items:
                  $ref: "#/components/schemas/identifier"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
    write-collection:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              updateReason:
                description: Why this version was published.
                $ref: "#/components/schemas/collection-update-reason"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
            required:
              - updateReason
    write-distribution:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            description: |
              `distributionId` is absent by design: the server assigns it, and
              a publisher-supplied identifier would let one tenant claim
              another's. It is derived from the release and the natural key
              below, so re-publishing the same download is an update.
            properties:
              description:
                type: string
                description: |
                  What this channel or format is, in terms a human choosing how
                  to install would recognise. Required when there is no `url`,
                  and used as the natural key in that case.
              url:
                type: string
                format: url
                description: |
                  Direct download URL. Must be absolute and http(s): a relative
                  path would resolve against the consumer's own origin, and
                  other schemes ask a consumer to do something it did not
                  request.
              signatureUrl:
                type: string
                format: url
                description: Direct download URL for the detached signature.
              identifiers:
                type: array
                description: |
                  Identifiers for this distribution specifically. Optional
                  because several real channels have no accepted purl type —
                  Homebrew and Scoop among them — and an identifier that names
                  a coordinate which does not resolve is worse than none, since
                  a consumer will follow it.
                items:
                  $ref: "#/components/schemas/identifier"
              checksums:
                type: array
                description: |
                  Recorded verbatim. This server does not hold the bytes and
                  cannot verify them, so these are the publisher's assertion,
                  not ours.
                items:
                  $ref: "#/components/schemas/checksum"
            anyOf:
              - required:
                  - url
              - required:
                  - description
    write-artifact:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              collection:
                description: |
                  UUID of the collection this artifact belongs to, which is the
                  UUID of its release.
                $ref: "#/components/schemas/uuid"
              name:
                type: string
                description: Human-readable name of the artifact.
              type:
                $ref: "#/components/schemas/artifact-type"
              formats:
                type: array
                description: |
                  The representations this artifact is published in. A format
                  may carry a `url` when the publisher hosts the bytes itself;
                  otherwise they are uploaded to this server afterwards.
                items:
                  $ref: "#/components/schemas/artifact-format"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
            required:
              - collection
              - name
              - formats
    update-artifact:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            description: |
              Metadata only. Stored bytes are immutable — replacing content
              means a new format or a new artifact, not an overwrite.
            properties:
              name:
                type: string
              type:
                $ref: "#/components/schemas/artifact-type"
              accessPolicy:
                $ref: "#/components/schemas/access-policy"
security:
  - bearerAuth: []
  - basicAuth: []
tags:
  - name: TEA Product
  - name: TEA Product Release
  - name: TEA Component
  - name: TEA Component Release
  - name: TEA Artifact
  - name: TEA Discovery
  - name: CLE
  - name: TEA Publication
    description: |
      Operations that create, update and delete the objects the consumption API
      serves.
  - name: TEA Access Policy
    description: |
      Operations controlling who may read an object through the consumption
      API: the publishing organisation alone, named counterparties, or anyone.
externalDocs:
  description: Transparency Exchange API specification
  url: https://github.com/CycloneDX/transparency-exchange-api
