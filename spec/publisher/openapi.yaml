          schema:
            type: object
            properties:
              collectionUuid:
                type: string
                format: uuid
                description: The collection this artifact belongs to.
              name:
                type: string
                description: Human-readable name of the artifact.
              type:
                type: string
                description: Type of artifact, as defined by the consumption API.
              author:
                type: string
                description: Author of the artifact.
              formats:
                type: array
                description: |
                  The representations this artifact is published in. A format
                  may carry a `url` when the publisher hosts the bytes itself;
                  otherwise the bytes are uploaded to this server afterwards.
                items:
                  $ref: '#/components/schemas/artifactFormat'
              distribution:
                $ref: '#/components/schemas/distribution'
            required:
              - collectionUuid
              - name
              - formats
    UpdateTeaArtifact:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: |
              Metadata only. Stored bytes are immutable — see the operation
              description for why replacing content means a new format or a new
              artifact rather than an overwrite.
            properties:
              name:
                type: string
              type:
                type: string
              author:
                type: string
              distribution:
                $ref: '#/components/schemas/distribution'
