    publisher-error-type:
      type: string
      description: |
        Classification of a publication error.

        Extends the consumption specification's `unknown-error-type` with the
        failures only a writer can hit. The two consumption values are repeated
        so a client can branch on one enumeration rather than two.
      enum:
        - OBJECT_UNKNOWN
        - OBJECT_NOT_SHAREABLE
        - INVALID_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - DUPLICATE_OBJECT
        - VERSION_CONFLICT
        - ACCESS_WIDENS_PARENT
        - UNSUPPORTED_MEDIA_TYPE
        - PAYLOAD_TOO_LARGE
        - CHECKSUM_MISMATCH
        - SIGNATURE_INVALID
        - MIRRORING_UNSUPPORTED
        - UNKNOWN_PUBLICATION_TARGET
    publisher-error-response:
      type: object
      description: |
        A publication error. Same envelope as the consumption specification's
        `error-response`, over the wider publication enumeration, with an
        optional human-readable message and a pointer to the offending field.

        Publication is automated, and a release pipeline is usually the caller,
        so a failure has to be actionable without a human reading prose.
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/publisher-error-type"
        message:
          type: string
          description: Human-readable explanation. Not a stable interface; branch on `error`.
        field:
          type: string
          description: JSON Pointer to the offending member of the request body, where one applies.
      required:
        - error
    access-policy:
      type: object
      description: |
        Who may read an object through the consumption API.

        TEA describes how transparency data is fetched, not who is entitled to
        fetch it. That is a reasonable boundary for a consumption API and an
        impossible one for a publication API, where the same server holds
        material that is deliberately public, material shared with named
        counterparties under agreement, and material that is purely internal.
        Absent this, every publisher invents an answer, incompatibly.

        Resolved along the chain from the object to the root: an artifact sits
        under its collection, a collection under its release, a release under
        its product. The policy in force is the NARROWEST declared anywhere on
        that chain, not the nearest.

        The distinction is the whole guarantee. Under nearest-wins, an artifact
        that had declared `public` before its product was set to `private` goes
        on being public, because its own declaration is the nearest one and so
        becomes the answer. `ACCESS_WIDENS_PARENT` alone does not prevent this:
        it rejects a declaration that is too wide at the moment it is written,
        and says nothing about a parent narrowed afterwards. A publisher
        narrowing a product is entitled to expect that to mean something about
        everything beneath it.

        Where more than one level declares `shared`, the entitlements are the
        INTERSECTION of their `sharedWith` sets and the earliest expiry applies.
        A grant made on a child cannot create an entitlement its parent
        withheld.

        A server MUST NOT rewrite the declarations of descendants when an
        ancestor narrows. Folding is reversible and rewriting is not: widening
        a product back restores each descendant to its own declaration and no
        further, which is what makes a temporary embargo a supported operation
        rather than a decision that cannot be undone.

        A consumer denied by this policy is answered with the consumption
        specification's existing `OBJECT_NOT_SHAREABLE`, so enforcement needs
        no new consumer-side behaviour.
      additionalProperties: false
      properties:
        visibility:
          type: string
          description: |
            `private`: only the publishing organisation may read it.

            `shared`: readable by the publishing organisation and the
            organisations named in `sharedWith`. Authentication is required and
            the reader's identity decides the answer.

            `public`: readable without authentication. The only value that
            makes an object part of the open transparency web, and irreversible
            in practice: what has been fetched cannot be recalled.
          enum:
            - private
            - shared
            - public
          default: private
        sharedWith:
          type: array
          description: |
            Organisations entitled to read this object when `visibility` is
            `shared`. MUST be empty for any other visibility, so that a later
            change to `private` cannot silently leave a grant standing.
          items:
            $ref: "#/components/schemas/share-grant"
        publishTo:
          type: array
          description: |
            Registered publication targets this object is mirrored to, by
            UUID. Mirroring is a copy, not a reference: once an object reaches
            another server, this server's policy no longer governs it, which is
            why a target has to be registered deliberately rather than named
            inline by URL.

            A server that does not mirror MUST reject a non-empty list with
            `MIRRORING_UNSUPPORTED`. Accepting it and doing nothing is the one
            unacceptable response, because the publisher would then believe a
            copy exists somewhere it does not.

            Naming a target that is not registered is `UNKNOWN_PUBLICATION_TARGET`.
          items:
            $ref: "#/components/schemas/uuid"
      required:
        - visibility
    share-grant:
      type: object
      description: An entitlement for one organisation to read one object.
      additionalProperties: false
      properties:
        organizationUuid:
          description: The consuming organisation's identifier on this server.
          $ref: "#/components/schemas/uuid"
        organizationName:
          type: string
          description: Display name when the grant was made. Advisory; the UUID is the identity.
        grantedAt:
          $ref: "#/components/schemas/date-time"
        expiresAt:
          description: |
            When the grant lapses. A grant for the length of an evaluation or a
            contract is the common case, and a server that cannot express an
            expiry pushes publishers towards grants nobody ever revokes.
          $ref: "#/components/schemas/date-time"
      required:
        - organizationUuid
    publication-target:
      type: object
      description: |
        A remote TEA server this publisher mirrors objects to, as this server
        holds it.

        Registered as its own object rather than named inline in a policy for
        two reasons. A credential is involved, and a credential repeated in
        every policy is a credential in every audit log. And mirroring is a
        copy the receiving server then governs, so which servers a publisher is
        willing to hand objects to is a decision worth making once and
        reviewing, not one made in passing while setting a visibility.
      additionalProperties: false
      properties:
        uuid:
          description: Identifier of this target on this server.
          $ref: "#/components/schemas/uuid"
        rootUrl:
          type: string
          format: uri
          description: |
            The remote server's TEA root, without a trailing slash. This is the
            same value that server advertises as `rootUrl` in its own discovery
            document.
        domain:
          type: string
          description: |
            The TEI domain-name component of the target, which is what a
            consumer resolves. Derived from `rootUrl` and reported so a
            publisher can see where a copy went.
        description:
          type: string
          description: What this target is, for whoever reviews the list later.
        credential:
          type: string
          writeOnly: true
          description: |
            Bearer credential this server presents when publishing to the
            target. Write-only: a server MUST NOT return it, and MUST NOT
            report whether one is held in any form that distinguishes one
            credential from another.
        createdAt:
          $ref: "#/components/schemas/date-time"
      required:
        - uuid
        - rootUrl
    mirror-status:
      type: object
      description: |
        The state of mirroring one object to one target.

        Reported rather than set: a publisher states where an object should go
        and the server reports how far it got. A publisher that cannot see a
        failed mirror has to discover it from the counterparty.
      additionalProperties: false
      properties:
        target:
          description: The publication target this state refers to.
          $ref: "#/components/schemas/uuid"
        domain:
          type: string
          description: The target's TEI domain, repeated so a reader need not resolve the UUID.
        state:
          type: string
          description: |
            State of the most recent attempt.

            `pending` means accepted locally and not yet copied. `published`
            means the target acknowledged it. `failed` means the last attempt did not
            succeed and `detail` says why; the server SHOULD retry, and MUST
            NOT silently give up without leaving this state visible.
          enum:
            - pending
            - published
            - failed
        lastAttemptAt:
          $ref: "#/components/schemas/date-time"
        detail:
          type: string
          description: Why the last attempt failed, when it did.
      required:
        - target
        - state
    artifact-signature:
      type: object
      description: |
        A detached signature over an artifact format's bytes.

        signatures/signature.md calls for an indication of the hash algorithm,
        an indicator of the certificate used, and the intermediate and signing
        certificates. This carries them, plus the transparency-log entry where
        the scheme has one. A signature that is itself publicly logged is far
        harder to backdate.
      additionalProperties: false
      properties:
        signatureType:
          type: string
          description: The scheme, so a consumer knows how to verify rather than having to guess.
          enum:
            - jws
            - jsf
            - cose
            - pgp
            - x509-cms
            - sigstore-bundle
            - ssh
        url:
          type: string
          format: url
          description: Direct download URL for the detached signature.
        algorithm:
          type: string
          description: Hash algorithm the signature was computed over, e.g. SHA-256.
        keyId:
          type: string
          description: Key identifier the signature was produced with, where the scheme has one.
        certificateUrl:
          type: string
          format: url
          description: Signing certificate, where verification needs one.
        certificateChainUrl:
          type: string
          format: url
          description: Intermediate certificates between the signing certificate and a trusted root.
        transparencyLogUrl:
          type: string
          format: url
          description: Entry in a signature transparency log, such as Rekor.
        signedAt:
          $ref: "#/components/schemas/date-time"
      required:
        - signatureType
        - url
    access-policy-status:
      type: object
      description: An object's declared access policy alongside the one actually enforced.
      additionalProperties: false
      properties:
        uuid:
          description: The object the policy applies to.
          $ref: "#/components/schemas/uuid"
        declared:
          description: |
            What this object sets for itself. Absent when it declares nothing
            and relies entirely on inheritance.
          $ref: "#/components/schemas/access-policy"
        effective:
          description: |
            What is enforced: the narrowest policy declared between this object
            and the root, with `shared` entitlements intersected.
          $ref: "#/components/schemas/access-policy"
        inheritedFrom:
          description: |
            The ancestor that constrained the answer, so a publisher can fix the
            cause rather than the symptom.

            Present whenever an ancestor is what makes the effective policy
            narrower than this object's own declaration, which includes the case
            where the object declares something of its own and is overruled. An
            ancestor that merely agrees is not the cause and is not reported.
          $ref: "#/components/schemas/uuid"
        mirrors:
          type: array
          description: |
            How far mirroring has got, per target. Absent where the object is
            mirrored nowhere, or where the server does not mirror at all.
          items:
            $ref: "#/components/schemas/mirror-status"
      required:
        - uuid
        - effective
    publication:
      type: object
      description: |
        One product this organisation has published, as the consumption API
        serves it, alongside the access policy in force for it.

        The product is carried whole rather than flattened so that a publisher
        can compare it byte for byte against what `GET /product/{uuid}`
        returns; a summary in a different shape would have to be trusted rather
        than checked.
      additionalProperties: false
      properties:
        product:
          $ref: "#/components/schemas/product"
        accessPolicy:
          description: Declared and effective policy, so the gap between them is visible here too.
          $ref: "#/components/schemas/access-policy-status"
        releaseCount:
          type: integer
          minimum: 0
          description: How many releases exist beneath this product.
      required:
        - product
        - accessPolicy
    published-release:
      type: object
      description: One release this organisation has published, with what a consumer would find in it.
      additionalProperties: false
      properties:
        release:
          $ref: "#/components/schemas/productRelease"
        accessPolicy:
          $ref: "#/components/schemas/access-policy-status"
        collectionVersion:
          type: integer
          minimum: 0
          description: |
            Version of this release's current collection, or 0 where no
            collection has been published yet, a release a consumer can
            resolve and find nothing in.
        artifactCount:
          type: integer
          minimum: 0
          description: How many artifacts the current collection holds.
      required:
        - release
        - accessPolicy
    paginated-publication-target-response:
      description: A paginated response containing registered publication targets
      allOf:
        - $ref: "#/components/schemas/pagination-details"
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: "#/components/schemas/publication-target"
          required:
            - results
    paginated-publication-response:
      description: A paginated response containing this organisation's published products
      allOf:
